runtime:
  profile: "baseline"
  max_frames: 120
  seed: 7

camera:
  fps: 15
  width: 224
  height: 224
  channels: 3
  source_type: "mock"
  image_dir: null
  image_pattern: "*.png"
  recursive: true

spatial:
  model_name: "mock_mobilenetv3_small"
  feature_dim: 64
  weights_path: null
  device: "cpu"
  conf_threshold: 0.25
  max_det: 20
  input_size: 640
  fallback_to_mock: true

temporal:
  model_name: "gru_mock"
  window_size: 8
  num_contexts: 4
  hidden_dim: 32
  checkpoint_path: null
  device: "cpu"
  dropout: 0.1

labels:
  - "idle"
  - "approach"
  - "manipulate"
  - "handover"

scoring:
  context_weight: 0.35
  boundary_weight: 0.30
  uncertainty_weight: 0.20
  novelty_weight: 0.15
  high_threshold: 0.72
  mid_threshold: 0.48

curation:
  ring_buffer_size: 128
  pre_event_frames: 8
  post_event_frames: 8

storage:
  base_dir: "outputs"
  run_name: "baseline_default"
  save_raw_frames: false
