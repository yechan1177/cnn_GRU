runtime:
  profile: "rtx3080ti_yolo_gru_runtime"
  max_frames: 120
  seed: 7

camera:
  fps: 10
  width: 1280
  height: 720
  channels: 3
  source_type: "image_folder"
  image_dir: "dataset/train/image/image_1"
  image_pattern: "*.png"
  recursive: true

spatial:
  model_name: "yolo_nano"
  feature_dim: 64
  weights_path: "experiments/exp_004_yolo_nano_training/runs/yolov8n_e20_frac01_gpu/weights/best.pt"
  device: "cuda:0"
  conf_threshold: 0.25
  max_det: 30
  input_size: 640
  fallback_to_mock: true

temporal:
  model_name: "gru_torch"
  window_size: 8
  num_contexts: 7
  hidden_dim: 96
  checkpoint_path: "experiments/exp_008_multichannel_temporal_training/runs/mcnn_gru_vehicle_e12_h96_c24/checkpoints/best.pt"
  device: "cuda:0"
  dropout: 0.1

labels:
  - "background"
  - "event_vehicle"
  - "people"
  - "speed_bump"
  - "traffic_light"
  - "traffic_sign"
  - "vehicle"

scoring:
  context_weight: 0.35
  boundary_weight: 0.30
  uncertainty_weight: 0.20
  novelty_weight: 0.15
  high_threshold: 0.70
  mid_threshold: 0.45

curation:
  ring_buffer_size: 128
  pre_event_frames: 8
  post_event_frames: 8

storage:
  base_dir: "outputs"
  run_name: "rtx3080ti_yolo_gru_runtime"
  save_raw_frames: false
